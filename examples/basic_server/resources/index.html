<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTTP Server Test</title>
  <link rel="icon" href="/assets/img/favicon.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <header>
    <img src="/assets/img/logo.svg" alt="Logo" class="logo">
    <h1>HTTP Server 動作確認ページ</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/assets/img/sample.png">Sample Image</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>静的ファイル確認</h2>
      <ul>
        <li>HTML: このページ</li>
        <li>CSS: <code>/assets/css/styles.css</code> を参照中</li>
        <li>JS: <code>/assets/js/script.js</code> を参照中</li>
        <li>画像: <code>/assets/img/*</code></li>
        <li>Favicon: <code>/assets/img/favicon.png</code></li>
      </ul>
    </section>

    <section>
      <h2>JavaScript Fetch テスト</h2>
      <p><button id="btn-fetch">/version.json を取得</button></p>
      <pre id="fetch-result" aria-live="polite">未実行</pre>
    </section>

    <section>
      <h2>HTTP ヘッダ確認</h2>
      <p>以下の画像は <code>Cache-Control</code> の挙動確認用にクエリ付きで読み込みます。</p>
      <img id="cache-buster" alt="Cache test" width="320" height="180">
      <p><button id="btn-reload-img">同じURLを再読込</button></p>
    </section>
  </main>

  <footer>
    <p>© HTTP Test</p>
  </footer>

  <script src="/assets/js/script.js" defer></script>
</body>
</html>
